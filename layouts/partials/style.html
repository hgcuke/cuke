<style>
    html {

    }

    html::-webkit-scrollbar {

    @supports (scrollbar-width: none) {

            scrollbar-width: none;
        }
    }
    
    :root {
        --background-color: #ffffff;
        --text-color: #333333;
        --secondary-color: #666666;
        --accent-color: #0066cc;
        --border-color: #eeeeee;
        --card-background: #f9f9f9;
    }
    
    @media (prefers-color-scheme: dark) {
        :root {
            --background-color: #1a1a1a;
            --text-color: #e0e0e0;
            --secondary-color: #b0b0b0;
            --accent-color: #4da6ff;
            --border-color: #333333;
            --card-background: #2a2a2a;
        }
    }
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

        padding: 20px;

        padding-bottom: 10px;

        font-size: 2.5rem;
        margin-bottom: 10px;
    }
    
    nav ul {

        display: flex;
        gap: 20px;
        margin-top: 20px;
        flex-wrap: wrap;
    }
    
    nav a {
        color: var(--text-color);
        text-decoration: none;
        font-weight: 500;
    }
    
    nav a:hover,
    nav a.active {

    }
    
    main {

    }

    }

    }
    
    p {

    .content {

    }

    }
    
    .content ul.contains-task-list {

        margin-left: 0;
    }
    
    .content .task-list-item {

        align-items: flex-start;

    }
    
    .content .task-list-item input[type="checkbox"] {
        margin-right: 10px;
        margin-top: 6px;
        flex-shrink: 0;

    .content ul li input[type="checkbox"] {

    }

        list-style-type: none !important;
    }
    
    .content ul:has(li input[type="checkbox"]) {
        list-style-type: none !important;
        padding-left: 0 !important;

    pre {

        color: #24292f;
    }

    code {

    .code-block-wrapper {

    }

    .copy-code-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 32px;
        height: 32px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: transparent;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.2s ease, background-color 0.2s ease;
        z-index: 10;
    }

    .code-block-wrapper:hover .copy-code-btn {
        opacity: 1;
    }

    .copy-code-btn:hover {
        background-color: transparent;
    }

    .copy-code-btn svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: #656d76;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.2s ease;
    }

    .copy-code-btn:hover svg {
        stroke: #24292f;
    }

    @media (prefers-color-scheme: dark) {
        .copy-code-btn svg {
            stroke: #cccccc;
        }

        .copy-code-btn:hover svg {
            stroke: #ffffff;
        }
    }

    .copy-code-btn.copied {
        background-color: transparent;
    }

    .copy-code-btn.copied svg {
        stroke: #4caf50;
    }

    .custom-scrollbar-track {
        background: transparent !important;
    }

    .custom-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.4) !important;
        border-radius: 0 !important;
    }

    .custom-scrollbar-thumb:hover,
    .custom-scrollbar-thumb:active {
        background: rgba(0, 0, 0, 0.6) !important;
    }

    @media (prefers-color-scheme: dark) {
        .custom-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4) !important;
        }

        .custom-scrollbar-thumb:hover,
        .custom-scrollbar-thumb:active {
            background: rgba(255, 255, 255, 0.6) !important;
        }
    }

    .page-scrollbar-track {
        position: fixed;
        top: 0;
        right: 0;
        width: 6px;
        height: 100vh;
        background: transparent;
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.2s;
    }

    .page-scrollbar-track:hover {
        opacity: 1;
    }

    .page-scrollbar-thumb {
        position: absolute;
        width: 100%;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 0;
        cursor: default;
        min-height: 30px;
    }

    .page-scrollbar-thumb:hover,
    .page-scrollbar-thumb:active {
        background: rgba(0, 0, 0, 0.6);
    }

    @media (prefers-color-scheme: dark) {
        .page-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
        }

        .page-scrollbar-thumb:hover,
        .page-scrollbar-thumb:active {
            background: rgba(255, 255, 255, 0.6);
        }
    }

    .content blockquote {
        margin: 0 0 16px;
        padding: 0 1em;
        color: var(--secondary-color);
        border-left: 0.25em solid var(--accent-color);
    }
    
    .content blockquote p {
        margin: 16px 0;
    }
    
    .content blockquote footer {

    }
    
    .content blockquote footer cite:before {
        content: "—";

    }

    .content table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 15px;
        overflow-x: auto;
        display: block;
    }
    
    .content th, .content td {

    .content th {

    .content tr:nth-child(even) {

    }

    .content hr {

    .content img {
        max-width: 100%;
        height: auto;
        display: block;

        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        tap-highlight-color: transparent;

    body:has(.image-zoom-toggle:checked) {
        overflow: hidden;
    }
    
    .image-zoom-container {
        position: relative;
        display: block;
    }
    
    .image-zoom-toggle {
        display: none;
    }
    
    .image-zoom-label {
        cursor: pointer;
        display: block;
        position: relative;
    }
    
    .image-zoom-label:focus {
        outline: 2px solid var(--accent-color);
        outline-offset: 2px;
    }
    
    .zoomable-image {
        transition: transform 0.3s ease;
    }

    .image-zoom-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 1);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 20px;
        margin: 0;
    }

    @media (prefers-color-scheme: dark) {
        .image-zoom-overlay {
            background: rgba(0, 0, 0, 1);
        }
    }
    
    .image-zoom-toggle:checked ~ .image-zoom-overlay {
        display: flex;
        cursor: pointer;
    }
    
    .image-zoom-toggle:checked ~ .image-zoom-label {
        cursor: default;
    }
    
    .image-zoom-toggle:checked ~ .image-zoom-overlay .zoomable-image {
        max-width: 90vw;
        max-height: 80vh;
        width: auto;
        height: auto;
        transform: scale(1);
        border: none;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        margin-left: auto !important;
        margin-right: auto !important;
        object-fit: contain;
        cursor: pointer;
    }

    @media (max-width: 800px) {
        .image-zoom-label {
            cursor: pointer;
        }
        
        .image-zoom-toggle:checked ~ .image-zoom-overlay {
            padding: 10px;
        }
    }

div.toc {
    position: fixed;
    top: 50%;
    left: calc((100vw + 800px) / 2);
    transform: translateY(-50%);
    width: calc((90vw - 800px) / 2);
    max-height: 80vh;
    overflow-y: auto;
    border: none;
    padding: 0;
    margin: 0;
    z-index: 99;
    -ms-overflow-style: none;
}

div.toc::-webkit-scrollbar {
    display: none;
}

@supports (scrollbar-width: none) {
    div.toc {
        scrollbar-width: none;
    }
}

.toc-nav {
    padding: 1.5rem;
}

.toc-nav ul,
.toc-nav ul ul,
.toc-nav ul ul ul,
.toc-nav ul ul ul ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: block;
}

.toc-nav li {
    margin: 6px 0;
    padding: 0;
    display: block;
    width: 100%;
    clear: both;
}

.toc-nav ul ul li {
    margin: 4px 0;
}

.toc-nav a {
    display: block;
    text-decoration: none;
    color: transparent;
    padding: 0 12px;
    transition: all 0.2s ease;
    font-size: 0.9rem;
    line-height: 1.4;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
