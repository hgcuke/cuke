{{ if and .TableOfContents (ne .TableOfContents "<nav id=\"TableOfContents\"></nav>") }}
<aside class="toc-nav" role="navigation" aria-label="目录">
  {{ .TableOfContents }}
</aside>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const tocNav = document.querySelector('.toc-nav');
    if (!tocNav) return;

    const tocLinks = Array.from(tocNav.querySelectorAll('a'));
    if (!tocLinks.length) return;

    const idToLink = new Map();
    const headings = [];
    const seen = new Set();

    for (const link of tocLinks) {
        const hash = link.hash || link.getAttribute('href');
        if (!hash || hash.charAt(0) !== '#') continue;
        const id = decodeURIComponent(hash.slice(1));
        idToLink.set(id, link);

        if (!seen.has(id)) {
            const h = document.getElementById(id);
            if (h) {
                headings.push(h);
                seen.add(id);
            }
        }
    }

    if (!headings.length) return;
    
    headings.sort((a, b) => {
        const rectA = a.getBoundingClientRect();
        const rectB = b.getBoundingClientRect();
        return rectA.top - rectB.top;
    });

    const OFFSET = 100;

    let currentActive = null;
    let currentChain = [];

    function buildChainFromLink(link) {
        const chain = [];
        if (!link) return chain;
        chain.push(link);
        
        const currentLi = link.closest('li');
        if (!currentLi) return chain;
        
        const parentList = currentLi.parentElement;
        if (!parentList || !['UL', 'OL'].includes(parentList.tagName)) return chain;
        
        const parentLi = parentList.closest('li');
        if (!parentLi) return chain;
        
        const children = parentLi.children;
        for (const child of children) {
            if (child.tagName === 'A') {
                chain.push(child);
                break;
            }
        }
        
        return chain;
    }

    function applyActiveChain(newLink) {
        if (newLink === currentActive) return;
        const newChain = buildChainFromLink(newLink);

        tocLinks.forEach(link => link.classList.remove('active'));
        for (const el of newChain) {
            el.classList.add('active');
        }

        currentActive = newLink || null;
        currentChain = newChain;
    }

    tocNav.addEventListener('click', function (e) {
        const link = e.target.closest('a');
        if (!link || !tocNav.contains(link)) return;

        const hash = link.hash || link.getAttribute('href');
        if (!hash || hash.charAt(0) !== '#') return;

        const id = decodeURIComponent(hash.slice(1));
        const target = document.getElementById(id);
        if (!target) return;

        e.preventDefault();

        const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        target.scrollIntoView({
            behavior: reduceMotion ? 'auto' : 'smooth',
            block: 'start'
        });

        applyActiveChain(link);
    });

    function updateActiveLink() {
        let linkToActivate = null;
        for (let i = headings.length - 1; i >= 0; i--) {
            const top = headings[i].getBoundingClientRect().top;
            if (top <= OFFSET) {
                linkToActivate = idToLink.get(headings[i].id) || null;
                break;
            }
        }
        applyActiveChain(linkToActivate);
    }

    let ticking = false;
    function onScrollOrResize() {
        if (!ticking) {
            requestAnimationFrame(function () {
                updateActiveLink();
                ticking = false;
            });
            ticking = true;
        }
    }

    window.addEventListener('scroll', onScrollOrResize, { passive: true });
    window.addEventListener('resize', onScrollOrResize, { passive: true });

    updateActiveLink();
});
</script>
{{ end }}
